spring.application.name=inventory-service
server.port=5051

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consumer

#does it mean inventory-group is a name of consumer group inside it multiple application can come. To come under this group application should use this property in application property
#
#Yes, you are 100% correct! That is exactly how it works.
#To break down your confirmation:
#• inventory-group is the explicit name of the consumer group. Inside this group, multiple instances or replicas of your application can join together.
#• To join this group, an application must use this exact property (spring.kafka.consumer.group-id=inventory-group) in its configuration file.
#
#How this works in practice:
#
#If you deploy 3 separate instances of your microservice (e.g., Instance A, Instance B, and Instance C) to handle high traffic, and all 3 instances have spring.kafka.consumer.group-id=inventory-group in their properties file:
#1. They act as a team: Kafka treats them as a single logical unit.
#2. No duplicate work: If your Kafka topic has 3 partitions, Kafka will assign Partition 1 to Instance A, Partition 2 to Instance B, and Partition 3 to Instance C.
#3. Automatic Failover: If Instance B crashes, Kafka notices it and automatically transfers Partition 2 to either Instance A or C so that your system keeps running without missing any data.
#
#⚠️ One Important Warning
#
#Only put the exact same code/application into the same consumer group.
#If you have a completely different application (like a shipping-service) that also needs to read the same messages, do not give it the same group ID. If you do, it will steal half the messages from your inventory service. Instead, give the shipping service its own distinct identity:
#properties
#spring.kafka.consumer.group-id=shipping-group

#Consumer
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON deserialization
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.awnish.*

#Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
